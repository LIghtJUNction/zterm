[package]
name = "zterm"
version = "0.5.2"
edition = "2024"
rust-version = "1.100"
license = "MIT"
authors = ["LIghtJUNction"]
repository = "https://github.com/LIghtJUNction/zterm"
description = "Bounded no_std terminal screen, scrollback and VT protocol state"
readme = "README.md"
include = ["/src/**", "/examples/**", "/README.md", "/LICENSE", "/Cargo.toml"]
keywords = ["terminal", "no-std", "vt", "ansi", "screen"]
categories = ["no-std", "command-line-interface", "parsing"]

[dependencies]
zgpui = { version = "0.1.2", default-features = false }
zgraphics = { version = "0.2.0", default-features = false }
zinput = { version = "0.1.3", default-features = false }
zvte = { version = "=0.1.3", default-features = false }
unicode-width = { version = "=0.2.3", default-features = false }
unicode-segmentation = { version = "=1.13.3", default-features = false }

[workspace]
resolver = "3"
